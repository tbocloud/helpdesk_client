name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-helpdesk_client-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # Ubuntu 26's mariadb client requires SSL, which the mariadb:10.6
    # service container doesn't offer, so bench new-site fails there.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Keep the v15 job named "Server": the main branch ruleset requires that check.
    name: ${{ matrix.frappe == 15 && 'Server' || format('Server (v{0})', matrix.frappe) }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: 15
            python: '3.11'
            node: 18
          - frappe: 16
            python: '3.14'
            node: 24

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-${{ matrix.frappe }} --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      # helpdesk_client runs on customers' ERPNext sites and links to ERPNext
      # doctypes (Customer / Supplier in Address Fetcher), so test against it.
      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --skip-assets erpnext --branch version-${{ matrix.frappe }}
          bench get-app --skip-assets helpdesk_client $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-host 127.0.0.1 --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app helpdesk_client
          bench build --app helpdesk_client
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          # Frappe runs only the tested app's before_tests hook, so complete
          # ERPNext's setup wizard here; test-record bootstrap creates
          # `_Test Company`, which needs ERPNext's setup fixtures (e.g. Warehouse Type).
          # ERPNext v16 dropped before_tests; importing its test utils builds the
          # same fixtures (this is how ERPNext's own CI bootstraps).
          if [ "${{ matrix.frappe }}" = "15" ]; then
            bench --site test_site execute erpnext.setup.utils.before_tests
          else
            bench --site test_site run-tests --lightmode --module erpnext.tests.bootstrap_test_data
          fi
          bench --site test_site run-tests --app helpdesk_client
        env:
          TYPE: server
